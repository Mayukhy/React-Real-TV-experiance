# Production docker-compose for cloud deployment
version: "3.8"

services:
  websocket-server:
    image: ${DOCKER_USERNAME}/tv-app-websocket:latest
    ports:
      - "${WS_PORT:-3004}:3004"
    environment:
      - NODE_ENV=production
      - PORT=3004
    restart: unless-stopped
    
  tv-app:
    image: ${DOCKER_USERNAME}/tv-app-frontend:latest
    ports:
      - "${TV_PORT:-3000}:5173"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    depends_on:
      - websocket-server
    
  remote-app:
    image: ${DOCKER_USERNAME}/tv-app-remote:latest
    ports:
      - "${REMOTE_PORT:-3002}:3002"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    depends_on:
      - websocket-server

networks:
  default:
    driver: bridge